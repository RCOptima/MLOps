# databricks.yml
# Databricks Asset Bundle (DAB) definition for the MLOps capstone pipeline.
# Replaces the MLflow Recipes `recipe.yaml` runner (removed in MLflow 3.x)
# with a native Databricks Jobs DAG. Each Recipes "step" becomes a job "task".
#
# Deploy with:   databricks bundle deploy -t dev
# Run with:      databricks bundle run mlops_capstone_pipeline -t dev
 
bundle:
  name: mlops-framework

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-1562028782168508.8.azuredatabricks.net
    variables:
      catalog: mlops_test
      schema: capstone
      raw_data: ${var.catalog}.default.rc_test_data

  prod:
    mode: production
    workspace:
      host: https://adb-1562028782168508.8.azuredatabricks.net
      # We always use /Users/ross.campbell@optimapartners.co.uk for all resources to make sure we only have a single copy.
      root_path: /Users/ross.campbell@optimapartners.co.uk/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: ross.campbell@optimapartners.co.uk
    variables:
      catalog: mlops_prod
      schema: capstone_prod

variables: # i think most of these shold be in where the jobs places right as this is configurable
  catalog:
    description: Unity Catalog catalog to register models into
    default: mlops_test
  schema:
    description: Unity Catalog schema for the model
    default: capstone
  project_config:
    description: Path to project_config.yml
    default: configs/project_cfg.yml
  raw_data:
    description: Where the raw data is located
  ingested_data_path:
    description: Path to table that ingest.py saves to
    default: ${var.catalog}.${var.schema}.ingested_data
  train_table: 
    description: Name of delta table for training data
    default: ${var.catalog}.${var.schema}.train
  test_table:
    description: Name of delta table for training data
    default: ${var.catalog}.${var.schema}.test
  val_table:
    description: Name of delta table for testing data
    default: ${var.catalog}.${var.schema}.val
  model_name:
    description: Name of the model we are using
    default: ${var.catalog}.${var.schema}.capstone_model
  # git_branch:
  #   default: main

resources:
  jobs:
    mlops_framework_pipeline:
      name: mlops-framework-pipeline
      tags:
        project: mlops-framework

      # environments:
      #   - environment_key: default
      #     spec:
      #       environment_version: "2"
      #       dependencies:
      #         - -r /Workspace/Users/ross.campbell@optimapartners.co.uk/MLOps_framework/requirements.txt
      # git_source lets the job pull straight from your repo instead of
      # relying on manually synced workspace files.
      # git_source:
      #   git_url: <your-repo-url>
      #   git_provider: gitHub
      #   git_branch: ${var.git_branch}
 
      tasks:
        - task_key: ingest
          # job_cluster_key: main_cluster
          # environment_key: default
          existing_cluster_id: 0806-135457-eba3ndta
          spark_python_task:
            python_file: steps/01_ingest.py
            parameters: 
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--ingested_data_path"
              - ${var.ingested_data_path}

        - task_key: split
          depends_on:
            - task_key: ingest
          # job_cluster_key: main_cluster
          existing_cluster_id: 0806-135457-eba3ndta
          # environment_key: default
          spark_python_task:
            python_file: steps/02_split.py
            parameters:
              - "--ingested_data_path"
              - "${var.ingested_data_path}"
              - "--train_table"
              - "${var.train_table}"
              - "--test_table"
              - "${var.test_table}"
              - "--val_table"
              - "${var.val_table}"
 
        - task_key: transform
          depends_on:
            - task_key: split
          # job_cluster_key: main_cluster
          existing_cluster_id: 0806-135457-eba3ndta
          # environment_key: default
          spark_python_task:
            python_file: steps/03_transform.py
            parameters:
              - "--train_table"
              - "${var.train_table}"
              - "--val_table"
              - "${var.val_table}"
              - "--test_table"
              - "${var.test_table}"

        - task_key: train
          depends_on:
            - task_key: transform
          # job_cluster_key: main_cluster
          existing_cluster_id: 0806-135457-eba3ndta
          # environment_key: default
          spark_python_task:
            python_file: steps/04_train.py
            parameters:
              - "--train_table"
              - "${var.train_table}"
              - "--val_table"
              - "${var.val_table}"
              - "--model_name"
              - "${var.model_name}"
 
        - task_key: evaluate
          depends_on: [{task_key: train}]
          # job_cluster_key: main_cluster
          existing_cluster_id: 0806-135457-eba3ndta
          # environment_key: default
          spark_python_task:
            python_file: steps/05_evaluate.py
            parameters:
            - "--primary_metric"
            - "{{tasks.train.values.primary_metric}}"
            - "--experiment_id"
            - "{{tasks.train.values.experiment_id}}"
            - "--batch_id"
            - "{{tasks.train.values.batch_id}}"
            - "--test_table"
            - "${var.test_table}"
            - "--model_name"
            - "${var.model_name}"
            - "--target_col"
            - "{{tasks.train.values.target_col}}"

  
        - task_key: register
          depends_on:
            - task_key: evaluate
          # job_cluster_key: main_cluster
          # environment_key: default
          existing_cluster_id: 0806-135457-eba3ndta
          spark_python_task:
            python_file: steps/06_register.py
            parameters: 
              - "--model_name"
              - "${var.model_name}"
              - "--challenger_score"
              - "{{tasks.evaluate.values.challenger_score}}"
              - "--greater_is_better"
              - "{{tasks.evaluate.values.greater_is_better}}"
              - "--primary_metric"
              - "{{tasks.train.values.primary_metric}}"
 
        - task_key: deploy
          depends_on:
            - task_key: register
          existing_cluster_id: 0806-135457-eba3ndta
          spark_python_task:
            python_file: steps/07_deploy.py
            parameters: 
              - "--model_name"
              - "${var.model_name}"
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
 
        - task_key: monitor
          depends_on:
            - task_key: deploy
          existing_cluster_id: 0806-135457-eba3ndta
          spark_python_task:
            python_file: steps/08_monitor.py
            parameters: 
              - "--model_name"
              - "${var.model_name}"
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--val_table"
              - "${var.val_table}"
              - "--endpoint_name"
              - "{{tasks.deploy.values.endpoint_name}}"
 
 
      # email_notifications:
      #   on_failure:
      #     - <your-email>@example.com