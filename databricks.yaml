# databricks.yml
# Databricks Asset Bundle (DAB) definition for the MLOps capstone pipeline.
# Replaces the MLflow Recipes `recipe.yaml` runner (removed in MLflow 3.x)
# with a native Databricks Jobs DAG. Each Recipes "step" becomes a job "task".
#
# Deploy with:   databricks bundle deploy -t dev
# Run with:      databricks bundle run mlops_capstone_pipeline -t dev
 
bundle:
  name: mlops-framework
 
variables:
  catalog:
    description: Unity Catalog catalog to register models into
    default: main
  schema:
    description: Unity Catalog schema for the model
    default: mlops_framework
  model_name:
    description: Fully qualified UC model name
    default: ${var.catalog}.${var.schema}.capstone_model
  git_branch:
    default: main
  target_col:
    default: label
  split_ratios:
    default: "0.75,0.125,0.125"
# ---------------------------------------------------------------------------
# Targets: mirrors what your databricks-dev.yaml was doing for the dev env.
# Add a "prod" target the same way when you're ready for the deploy step.
# ---------------------------------------------------------------------------
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-1562028782168508.8.azuredatabricks.net
    run_as:
      user_name: ross.campbell@optimapartners.co.uk
 
resources:
  jobs:
    mlops_framework_pipeline:
      name: mlops-framework-pipeline
      tags:
        project: mlops-framework
 
      # git_source lets the job pull straight from your repo instead of
      # relying on manually synced workspace files.
      # git_source:
      #   git_url: <your-repo-url>
      #   git_provider: gitHub
      #   git_branch: ${var.git_branch}
 
      job_clusters:
        - job_cluster_key: main_cluster
          new_cluster:
            spark_version: 17.3.x-cpu-ml-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 2
 
      # -----------------------------------------------------------------
      # Task DAG: ingest -> split -> transform -> train -> register
      # This is the same dependency order Recipes inferred from its
      # step definitions; here it's explicit via `depends_on`.
      # -----------------------------------------------------------------
      tasks:
        - task_key: ingest
          job_cluster_key: main_cluster
          spark_python_task:
            python_file: ../steps/ingest.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}"]
 
        - task_key: split
          depends_on:
            - task_key: ingest
          job_cluster_key: main_cluster
          spark_python_task:
            python_file: ../steps/split.py                                                                                                                                                                          
 
        - task_key: transform
          depends_on:
            - task_key: split
          job_cluster_key: main_cluster
          spark_python_task:
            python_file: ../steps/transform.py
 
        - task_key: train
          depends_on:
            - task_key: transform
          job_cluster_key: main_cluster
          spark_python_task:
            python_file: ../steps/train.py
            parameters: ["--model_name", "${var.model_name}"]
 
        - task_key: evaluate
          depends_on: [{task_key: train}]
          spark_python_task:
            python_file: ../steps/evaluate.py
            parameters: ["--primary_metric", "${var.primary_metric}", "--threshold", "0.75"]

  
        - task_key: register
          depends_on:
            - task_key: evaluate
          job_cluster_key: main_cluster
          spark_python_task:
            python_file: ../steps/register.py
            parameters: ["--model_name", "${var.model_name}"]
 
        # New tasks vs. your current setup — these are what Recipes never
        # gave you a clean way to do, but the capstone deliverables ask for:
        - task_key: deploy
          depends_on:
            - task_key: register
          job_cluster_key: main_cluster
          spark_python_task:
            python_file: ../steps/deploy.py
            parameters: ["--model_name", "${var.model_name}"]
 
        - task_key: monitor
          depends_on:
            - task_key: deploy
          job_cluster_key: main_cluster
          spark_python_task:
            python_file: ../steps/monitor.py
            parameters: ["--model_name", "${var.model_name}"]
 
 
      # email_notifications:
      #   on_failure:
      #     - <your-email>@example.com